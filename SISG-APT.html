<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SISG · Administración de Proyectos</title>
<meta name="description" content="Presentación interactiva del plan de gestión del proyecto SISG (Grupo 4) para el curso Administración de Proyectos Tecnológicos: metodología, planificación, riesgos, calidad y normas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>
/* SISG-APT · Presentación del plan de gestión. Papel crema, tinta oscura, tipografía monoespaciada, sombras duras. */
:root {
  --paper: #f4ebe0; --card: #faf4ea; --ink: #1d1b18; --muted: #6f6961; --line: rgba(29, 27, 24, .16);
  --lime: #cfe3b2; --lav: #ddd3f2; --sky: #d6e6f5; --rose: #f6d3cf; --sun: #f6e2a8;
  --c-orange: #f3b17a; --c-blue: #a9c8ee; --c-purple: #c9b8ee; --c-green: #b9d99a; --c-pink: #f0a4a8; --c-teal: #8fd0c4; --c-yellow: #f6d98a;
  --ok: #2f7d32; --warn: #a8741a; --bad: #b3392f;
  --shadow: 3px 3px 0 var(--ink);
  --font: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #1a1815; --card: #23201c; --ink: #efe6d8; --muted: #a39a8c; --line: rgba(239, 230, 216, .18);
  --lime: #4d6035; --lav: #3f3860; --sky: #2e4560; --rose: #61363a; --sun: #5e5028; --shadow: 3px 3px 0 #000;
  --ok: #8fd18f; --warn: #e0b45a; --bad: #f08a80; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 13px/1.55 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
code { font-family: var(--font); padding: 0 5px; border-radius: 5px; background: rgba(29, 27, 24, .09); font-size: .93em; }
kbd { font: 600 12px var(--font); padding: 1px 7px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--card); }
small { color: var(--muted); }

#app { height: 100%; display: grid; grid-template-rows: 56px minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; white-space: nowrap; text-decoration: none; color: inherit; }
.brand svg { width: 30px; height: 30px; flex: none; } .brand mark { background: var(--lime); padding: 0 4px; color: inherit; }
.top .grow { flex: 1; }
.icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); }
.icon-btn:hover { border-color: var(--ink); } .icon-btn svg { width: 18px; height: 18px; }
body.dk-full .top { display: none; } body.dk-full #app { grid-template-rows: minmax(0, 1fr); }

/* ---------- motor ---------- */
#deck { display: flex; flex-direction: column; min-height: 0; background: var(--paper); }
.dk-top { display: flex; align-items: center; gap: 12px; padding: 6px 18px; border-bottom: 1px solid var(--line); font-size: 12px; }
.dk-top .grow { flex: 1; } .dk-count { font-weight: 800; letter-spacing: .08em; } .dk-name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 44vw; }
.dk-top button { padding: 5px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); font-size: 12px; font-weight: 600; }
.dk-top button:hover { border-color: var(--ink); background: var(--lime); }
.dk-view { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.dk-slide { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: center; background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; font-size: 16px; }
.dk-bar { height: 4px; background: var(--line); } .dk-bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .35s; }
#dk-index { position: absolute; right: 14px; top: 94px; z-index: 20; width: 380px; max-height: 72vh; overflow-y: auto; padding: 12px; border: 2px solid var(--ink); border-radius: 12px; background: var(--card); box-shadow: 5px 5px 0 var(--ink); }
#dk-q { width: 100%; box-sizing: border-box; margin: 0 0 8px; padding: 6px 9px; border: 2px solid var(--ink); border-radius: 8px; background: var(--bg, #fff); color: inherit; font: inherit; font-size: 12px; } #dk-index button[hidden] { display: none; } #dk-nres { margin: 0 6px 6px; font-size: 11px; color: var(--muted); } #dk-index .sn { display: block; margin-top: 2px; font-size: 10.5px; color: var(--muted); font-weight: 400; line-height: 1.35; } #dk-index button span { flex: 1; min-width: 0; }
#dk-index h3 { margin: 2px 6px 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#dk-index button { display: flex; gap: 10px; width: 100%; padding: 5px 8px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 12px; }
#dk-index button:hover, #dk-index button[aria-current="true"] { background: var(--lime); color: #1d1b18; } #dk-index i { font-style: normal; color: var(--muted); font-weight: 700; }

.sl-head { position: absolute; left: 48px; right: 48px; top: 22px; display: flex; flex-direction: column; gap: 7px; }
.kick { align-self: flex-start; padding: 2px 11px; border: 1.5px solid var(--ink); border-radius: 99px; background: var(--c, var(--sun)); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1d1b18; }
.sl-head h1 { margin: 0; font-size: 33px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; }
.sl-body { position: absolute; left: 48px; right: 48px; top: 98px; bottom: 30px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.is-cover .sl-body { left: 0; right: 0; top: 0; bottom: 0; }
.sl-dots { position: absolute; right: 48px; bottom: 10px; display: flex; gap: 6px; }
.sl-dots i { width: 8px; height: 8px; border: 1.5px solid var(--ink); border-radius: 50%; } .sl-dots i.on { background: var(--ink); }

/* ---------- piezas comunes ---------- */
.foot { margin: auto 0 0; color: var(--muted); font-size: 12px; max-width: 150ch; }
.card { padding: 16px 18px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--card); min-width: 0; }
.card h3, .alc h3, .scr h3 { margin: 0 0 8px; font-size: 16px; }
.card p { margin: 0 0 8px; } .card ul, .alc ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.badge { display: inline-block; padding: 1px 10px; border: 1.5px solid var(--ink); border-radius: 99px; background: var(--sun); color: #1d1b18; font-size: 11px; font-weight: 700; white-space: nowrap; }
.badge.ok { background: var(--lime); } .badge.run { background: var(--sun); } .badge.pend { background: var(--rose); }
.badge.crit { background: #e8736b; } .badge.alto { background: var(--c-orange); } .badge.medio { background: var(--sun); } .badge.bajo { background: var(--lime); }
.call { padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--lav); font-size: 14px; } .call > b:first-child { display: block; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; }
.call.warn { background: var(--rose); } .call.info { background: var(--sky); } .call.ok { background: var(--lime); } .call.gold { background: var(--sun); }
.call, .call b, .call * { color: #1d1b18; }
.mut { color: var(--muted); }
.tag { display: inline-block; padding: 1px 10px; border: 1.5px solid var(--ink); border-radius: 99px; background: var(--lav); color: #1d1b18; font-size: 11px; font-weight: 700; }

.dt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.dt th { padding: 6px 9px; text-align: left; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--card); border-bottom: 2px solid var(--ink); white-space: nowrap; position: sticky; top: 0; }
.dt td { padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
.dt td.n { text-align: right; font-variant-numeric: tabular-nums; } .dt tr.clk { cursor: pointer; } .dt tr.clk:hover td, .dt tr.sel td { background: var(--lime); color: #1d1b18; }
.dt tr:nth-child(even) td { background: rgba(29, 27, 24, .03); } .dt tr.clk.sel td { background: var(--lime); }

/* portada */
.cv { display: grid; grid-template-columns: 740px 1fr; height: 100%; align-items: center; }
.cv-t { padding: 0 0 0 64px; display: flex; flex-direction: column; gap: 14px; }
.cv-k { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.cv h1 { margin: 0; font-size: 54px; line-height: 1.02; letter-spacing: -.02em; font-weight: 800; } .cv mark { background: var(--lime); color: inherit; padding: 0 8px; }
.cv p { margin: 0; font-size: 18px; max-width: 36ch; } .cv-team { display: flex; flex-wrap: wrap; gap: 8px; } .cv-team span { padding: 3px 12px; border: 1.5px solid var(--ink); border-radius: 99px; background: var(--card); font-size: 12.5px; font-weight: 600; }
.cv-hint { margin-top: 10px; color: var(--muted); font-size: 13px; }
.cv-route { list-style: none; margin: 0; padding: 0 48px 0 0; display: flex; flex-direction: column; gap: 10px; counter-reset: none; }
.cv-route li { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); opacity: .5; transition: .35s; }
.cv-route li i { display: grid; place-items: center; width: 40px; height: 40px; border: 2px solid var(--ink); border-radius: 50%; background: var(--c-red, #9b2335); color: #fff; font: 800 13px var(--font); font-style: normal; flex: none; }
.cv-route li:first-child i { background: #14203b; } .cv-route li span { font-weight: 700; font-size: 16px; }
.cv-route li.on { opacity: 1; border-color: var(--ink); box-shadow: 4px 4px 0 var(--ink); transform: translateX(-10px); background: var(--lime); color: #1d1b18; }

/* agenda */
.agenda { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.ag { display: flex; flex-direction: column; gap: 6px; padding: 16px; text-align: left; border: 2px solid var(--line); border-radius: 14px; background: var(--card); opacity: .45; transition: .35s; min-height: 170px; }
.ag.on { opacity: 1; border-color: var(--ink); background: var(--c); color: #1d1b18; box-shadow: 4px 4px 0 var(--ink); }
.ag-n { display: grid; place-items: center; width: 28px; height: 28px; border: 1.5px solid var(--ink); border-radius: 50%; background: var(--card); color: var(--ink); font-weight: 800; }
.ag b { font-size: 19px; } .ag small { color: inherit; opacity: .85; font-size: 12.5px; } .ag em { margin-top: auto; font-style: normal; font-size: 11px; font-weight: 700; }
.agenda-note { margin: 4px 0 0; color: var(--muted); }

/* contexto */
.ctx { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 14px; flex: 1; min-height: 0; }
.ctx > section { opacity: .15; transform: translateY(10px); transition: .5s; } .ctx > section.on { opacity: 1; transform: none; }
.c-a { border-top: 12px solid var(--c-orange); } .c-b { border-top: 12px solid var(--c-pink); } .c-c { border-top: 12px solid var(--c-green); }
.two-c { margin-top: 14px; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--sky); color: #1d1b18; font-size: 14px; } .two-c b { display: block; }
.hl { padding: 10px 12px; border-radius: 10px; background: var(--sun); color: #1d1b18; font-size: 14px; }
.steps3 { display: flex; align-items: center; gap: 6px; margin: 4px 0 12px; } .steps3 em { font-style: normal; color: var(--muted); font-size: 20px; }
.s3 { flex: 1; display: flex; flex-direction: column; gap: 3px; padding: 10px; border: 2px solid var(--ink); border-radius: 12px; background: var(--c-green); color: #1d1b18; text-align: center; }
.s3 i { font-style: normal; font-weight: 800; font-size: 20px; } .s3 span { font-size: 11.5px; }

/* objetivos */
.obj { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.oc { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); opacity: .15; transform: translateY(10px); transition: .45s; min-height: 220px; }
.oc.on { opacity: 1; transform: none; border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.oc header { display: flex; justify-content: space-between; align-items: center; } .oc header b { font-size: 22px; } .oc p { margin: 0; font-size: 14.5px; }
.oc footer { margin-top: auto; font-size: 12px; } .oc footer span { color: var(--muted); } .oc small { font-size: 11.5px; }

/* criterios */
.crit { display: grid; grid-template-columns: 230px 1fr; gap: 24px; flex: 1; min-height: 0; align-items: start; }
.ring { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; border: 1.5px solid var(--line); border-radius: 16px; background: var(--card); }
.ring svg { width: 170px; height: 170px; transform: rotate(-90deg); } .rg-bg { fill: none; stroke: var(--line); stroke-width: 14; } .rg-fg { fill: none; stroke: var(--ok); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1.2s ease-out; }
.rg-n { position: absolute; top: 58px; display: flex; flex-direction: column; align-items: center; } .rg-n b { font-size: 40px; line-height: 1; } .rg-n span { font-size: 11px; color: var(--muted); }
.ring ul { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; } .d { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); margin-right: 8px; } .d.ok { background: var(--c-green); } .d.run { background: var(--c-yellow); } .d.pend { background: var(--c-pink); }
.cl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.cl li { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; border: 1.5px solid var(--line); border-left: 8px solid var(--c-yellow); border-radius: 12px; background: var(--card); animation: up .5s ease-out both; animation-delay: var(--d); }
.cl li.ok { border-left-color: var(--c-green); } .cl li.pend { border-left-color: var(--c-pink); } .cl li i { font-style: normal; font-weight: 800; font-size: 18px; } .cl li b { display: block; font-size: 14px; } .cl li span { color: var(--muted); font-size: 12.5px; }
@keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* alcance */
.alc { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 14px; }
.alc section { padding: 16px 18px; border: 2px solid var(--ink); border-radius: 14px; background: var(--card); opacity: .12; transform: translateY(10px); transition: .5s; } .alc section.on { opacity: 1; transform: none; box-shadow: 4px 4px 0 var(--ink); }
.alc .in { border-top: 14px solid var(--c-green); } .alc .out { border-top: 14px solid var(--c-pink); } .alc .prj { grid-column: 1 / -1; border-top: 14px solid var(--c-blue); }
.alc h3 small { font-weight: 400; margin-left: 8px; font-size: 12px; } .alc li { font-size: 14px; } .alc .prj p { margin: 0; font-size: 14.5px; }

/* entregables */
.ent { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.ent article { padding: 14px 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--card); opacity: .15; transition: .45s; min-height: 140px; } .ent article.on { opacity: 1; border-color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.ent header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; } .ent header b { font-size: 16px; } .ent p { margin: 0; font-size: 14px; }

/* supuestos */
.sup { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .sup section { opacity: .12; transform: translateY(10px); transition: .5s; } .sup section.on { opacity: 1; transform: none; }
.sup li { font-size: 13.5px; } .roles .role { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 0; border-bottom: 1px solid var(--line); } .roles .role span { grid-column: 1; color: var(--muted); font-size: 12.5px; } .roles .role em { grid-row: 1 / 3; grid-column: 2; align-self: center; font-style: normal; font-size: 12.5px; text-align: right; } .roles .role .badge { grid-row: 1 / 3; grid-column: 2; align-self: center; } .roles small { display: block; margin-top: 8px; }

/* hitos */
.tl { position: relative; height: 270px; margin: 8px 0 4px; }
.tl-line { position: absolute; left: 3%; right: 1%; top: 127px; height: 8px; border: 1.5px solid var(--ink); border-radius: 99px; background: var(--card); overflow: hidden; } .tl-line i { display: block; height: 100%; width: 0; background: var(--c-green); transition: width .7s; }
.tl-m { position: absolute; width: 150px; margin-left: -75px; text-align: center; opacity: 0; transition: .4s; font-size: 12.5px; } .tl-m.on { opacity: 1; } .tl-m .dot { position: absolute; left: 50%; margin-left: -9px; width: 18px; height: 18px; border: 2px solid var(--ink); border-radius: 50%; background: var(--c-yellow); }
.tl-m.up { top: 0; height: 116px; display: flex; flex-direction: column; justify-content: flex-end; } .tl-m.up .dot { bottom: -24px; } .tl-m.dn { top: 150px; } .tl-m.dn .dot { top: -28px; }
.call strong { font-weight: 800; }
.tl-m b { display: block; font-size: 13px; } .tl-m small { display: block; line-height: 1.3; }
.tl-now { position: absolute; top: 104px; width: 0; border-left: 3px dashed var(--bad); height: 52px; z-index: 2; } .tl-now span { position: absolute; top: 54px; left: -18px; padding: 0 8px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; }

/* híbrido */
.hyb { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; } .hyb > * { transition: .5s; } .hy-route, .hy-adj, .gold { opacity: .12; transform: translateY(8px); } .hy-route.on, .hy-adj.on, .gold.on { opacity: 1; transform: none; }
.hy-bands { display: grid; grid-template-columns: 1fr 5fr; gap: 8px; } .hy-bands span { padding: 4px 12px; border-radius: 6px; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .06em; } .pred { background: #14203b; } .agil { background: #9b2335; }
.hy-route { list-style: none; margin: 0; padding: 0; display: flex; align-items: stretch; gap: 4px; }
.hy-route li { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 12px; background: var(--card); } .hy-route li i { font: 800 15px var(--font); font-style: normal; color: #9b2335; } .hy-route li:first-child i { color: #14203b; }
.hy-route li b { font-size: 13.5px; } .hy-route li small { font-size: 11px; line-height: 1.3; } .hy-route li.ok { background: var(--lime); color: #1d1b18; } .hy-route li.run { background: var(--sun); color: #1d1b18; } .hy-route li.ok small, .hy-route li.run small { color: #3b3a36; }
.hy-m { align-self: center; color: var(--muted); }
.hy-adj { display: grid; gap: 6px; } .adj { display: grid; grid-template-columns: 150px 1fr 1.7fr; gap: 12px; align-items: center; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); font-size: 13px; } .adj .was { color: var(--muted); } .adj .now { font-weight: 600; }

/* scrum */
.scr { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .scr article { padding: 16px 18px; border: 2px solid var(--ink); border-radius: 14px; background: var(--card); border-left: 12px solid #9b2335; opacity: .12; transition: .5s; } .scr article.on { opacity: 1; box-shadow: 4px 4px 0 var(--ink); }
.scr p { margin: 0 0 10px; font-size: 14px; } .sisg { padding: 10px 12px; border-radius: 10px; background: var(--sky); color: #1d1b18; font-size: 13.5px; } .sisg span { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; }

/* etapas */
.eta { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; flex: 1; min-height: 0; } .eta-t { overflow: auto; border: 1.5px solid var(--ink); border-radius: 12px; background: var(--card); align-self: start; max-height: 420px; }
.eta-d { padding: 16px 18px; border: 2px solid var(--ink); border-radius: 14px; background: var(--card); box-shadow: 4px 4px 0 var(--ink); overflow: auto; } .eta-d h3 { margin: 8px 0 6px; font-size: 21px; } .eta-d h4 { margin: 10px 0 2px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); } .eta-d p { margin: 0; font-size: 14px; } .dod { padding: 8px 10px; border-radius: 8px; background: var(--lime); color: #1d1b18; }

/* backlog */
.bk { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; flex: 1; min-height: 0; } .bk section { display: flex; flex-direction: column; gap: 10px; }
.bk h3 { margin: 0; padding: 4px 12px; border-radius: 8px; font-size: 13px; color: #1d1b18; border: 1.5px solid var(--ink); } .p-alta { background: var(--c-pink); } .p-media { background: var(--c-yellow); } .p-baja { background: var(--c-green); }

**: consulta 1 ≈ 11.1 ms y consulta 8 ≈ 1.6 ms, unas 7 veces más rápida (promedio de 50 ejecuciones, datos sintéticos)"]]},"dominios":{"cols":["Dominio","Pregunta de calidad","Aplicación en SISG"],"rows":[["Gobernanza","¿Se auditan los procesos y se mejora continuamente?","Auditoría en la aplicación (quién hizo qué y cuándo) y revisión semanal del grupo"],["Alcance","¿Cada requisito tiene criterio de aceptación y cómo se valida?","Criterios de aceptación por entregable (`01_acta_y_alcance.md`, B.3)"],["Cronograma","¿La prevención y las pruebas están dentro de cada entregable?","Pruebas e2e y reconciliación se ejecutan antes de cada entrega (paquetes 4.1 y 4.2)"],["Finanzas","¿Se presupuestó el costo de la calidad?","Paquetes 4.1 a 4.3 suman 17 h de 168 h de presupuesto"],["Interesados","¿La percepción del usuario se traduce en requisitos medibles?","Sesión de usabilidad y especificación de \"facilidad de uso\" (TABLA VII)"],["Recursos","¿El equipo tiene capacitación y herramientas desde el inicio?","Docker y scripts reproducibles (`run.sh`, `run_app.sh`); revisión por pares"],["Riesgo","¿Qué defectos detectados tarde tendrían mayor impacto?","Un error en el ETL falsea todos los indicadores: por eso la reconciliación es obligatoria (R3, R8); y una fuga de datos tendría el mayor impacto (R12)"]]},"defectos":{"cols":["Defecto","Causa","Corrección"],"rows":[["Las consultas se ejecutaban antes del ETL","Orden de scripts en `run.sh`","El ETL corre antes; las consultas van aparte"],["La tabla de sumarización era casi tan grande como el hecho (10,106 filas)","Grano demasiado fino (incluía geografía)","Se quitó la geografía; quedó en ≈ 1,800 filas"],["Los pacientes sin municipio perdían su departamento (80 estudios en \"Desconocido\")","El mapeo guardaba solo el municipio","Se guarda el departamento aparte; bajó a 40 (los que no traen ningún lugar)"],["`docker-compose.yml` quedó vacío tras una edición","Se abrió el archivo para escribir antes de leerlo","Se restauró; se revisa que ningún archivo quede en 0 bytes"]]},"tareas_usabilidad":{"cols":["#","Tarea","Éxito si…"],"rows":[["0","Ingrese al sistema con el correo y la contraseña dados y active la verificación en dos pasos.","Llega a la pantalla de inicio."],["**1**","**Registre a la paciente Ana López, mujer, nacida el 12/03/1990, de Quetzaltenango.**","**El paciente aparece en la lista. Es la tarea que mide la meta.**"],["2","*(cuenta del centro)* Registre un estudio de ultrasonido para Ana López, hoy, con costo de Q250.","El estudio aparece asociado a Ana."],["3","*(cuenta del organismo)* Cree la campaña «Jornada de salud del corazón», área cardiovascular, en Huehuetenango, que empieza el mes próximo.","La campaña aparece en la lista."],["4","Encuentre cuántos pacientes y estudios hay registrados.","Dice las cifras correctas."]]},"declaracion_ia":{"cols":["Campo","Declaración"],"rows":[["**Herramienta utilizada**","Claude Code, con el modelo Claude Sonnet 5.5 (Anthropic)"],["**Prompt**","El asistente trabajó a partir de instrucciones del grupo en una conversación (no un único prompt). Resumen: (1) revisar y mejorar el diseño de la aplicación; (2) leer el material de Classroom de Bases de Datos II y Administración de Proyectos; (3) diseñar el almacén de datos del proyecto (ER, modelo estrella, ETL y consultas); (4) redactar los documentos de gestión con las plantillas y sesiones del curso; (5) agregar carga masiva, bitácora y diseño adaptable a la aplicación; (6) agregar a la aplicación autenticación con segundo factor (MFA), roles, gestión de usuarios, auditoría con exportaciones y validación de datos de pacientes; (7) rehacer el capítulo de riesgos y el plan híbrido con lo visto en la sesión del 24 de octubre, a partir de capturas de pantalla de las diapositivas que compartió el grupo. ⚠ *Adjunten el historial completo de la conversación si el docente pide los prompts literales.*"],["**Propósito del uso**","Generar borradores de documentos (acta, alcance, EDT, cronograma, interesados, comunicaciones, riesgos, calidad, enfoque híbrido); escribir y probar el código SQL y de la aplicación (incluidas 49 pruebas automáticas); consultar con herramientas web el NVD y el aviso de seguridad de Apple para la Parte B del laboratorio A1-b; leer las capturas de la clase y extraer los métodos (RBS, NIST SP 800-30, plan de contingencia, laboratorio A1-b); calcular la ruta crítica, el PERT y el valor ganado con un script; buscar errores y corregirlos."],["**Secciones afectadas**","`docs/gestion/01` a `04` (todas las secciones; el capítulo de riesgos de `04` se reescribió con la RBS, el modelo de NIST, el plan de contingencia y la evidencia del laboratorio A1-b; el enfoque híbrido está en `02`, sección 6); `dw/` (scripts SQL, README y diseño estrella); `backend/` (carga masiva, bitácora, MFA, roles, usuarios, auditoría y validaciones); `nuevo-diseño/` (interfaz). Los números de los documentos 02 a 04 salen de un script de cálculo (`plan.py`), no se escribieron a mano."],["**Nivel de modificación**","El grupo declara que revisó a mano aproximadamente el **70%** del contenido generado con IA (27 de noviembre de 2026)."]]},"cifras":{"bac":168,"contingencia_pct":13,"gestion_pct":5,"texto_reservas":"- **Reserva de contingencia** (riesgos identificados): las respuestas de la TABLA III suman **19 h**. El 10% del BAC que sugiere la sesión 10 son 16.8 h y **no alcanza**; se fija en **13% = 21.8 h** (BAC de 168 h), que cubre las 19 h con 2.8 h de margen."},"sus":["Creo que me gustaría usar este sistema con frecuencia.","Encontré el sistema innecesariamente complejo.","Pensé que el sistema era fácil de usar.","Creo que necesitaría ayuda de una persona técnica para usarlo.","Encontré que las funciones estaban bien integradas.","Pensé que había demasiada inconsistencia en el sistema.","Imagino que la mayoría de las personas aprendería a usarlo rápido.","Encontré el sistema muy incómodo de usar.","Me sentí con mucha confianza usando el sistema.","Necesité aprender muchas cosas antes de poder usarlo."],"miembros":"Javier Augusto Estrada Gordillo, Jonathan Eduardo Jolón García, Jonathan Javier Soberanis Castillo","docentes":["Ing. Rafael G. Barrios Parra","Inga. Claudia Alegre"],"curso":"Administración de Proyectos Tecnológicos (3CE0101)","justificacion":"El SISG busca que los actores del ecosistema de salud compartan datos de forma segura y consistente. El documento de la OPS [1] propone partir de una **línea base**, definir una **arquitectura objetivo** y planear **transiciones**, con la interoperabilidad y la seguridad de la información como principios. Los centros de diagnóstico y los organismos no lucrativos **alimentan y consumen** datos, pero hoy trabajan con archivos de Excel y bases aisladas. Sin un modelo común, los ministerios, aseguradoras y universidades no pueden comparar estudios ni campañas por mes, tipo o lugar. Este módulo entrega ese modelo común y demuestra, con datos de prueba, que los indicadores se calculan sin perder filas ni montos (reconciliación en cero).","proposito":"registrar pacientes, estudios diagnósticos y campañas de salud de dos tipos de actores del Sistema Integral de Salud de Guatemala, y dejar esos datos listos para el análisis en un almacén de datos con modelo estrella.","alcance_incluye":["**Aplicación web** con autenticación (JWT), registro de entidades, pacientes, estudios (centros) y campañas (organismos), y un panel con totales.","**Esquema fuente** `sisg_fuente`: 3FN, catálogos, llaves foráneas, `CHECK`, índices, triggers de validación y bitácora.","**Almacén de datos** `sisg_dw`: `fact_estudio`, `fact_campana`, dimensiones tiempo, geografía y entidad (conformadas), paciente, grupo etario, tipo de estudio y área de campaña, más una tabla de sumarización.","**ETL** en procedimientos almacenados con registro de cargas (`etl_log`) y un script de reconciliación.","**Consultas analíticas** (8, con funciones de ventana) y un análisis comparativo con `EXPLAIN`."],"alcance_excluye":["Integración real con los demás grupos y con el rol de Gestor de plataforma (Grupo 8).","Puesta en producción, HTTPS real y recuperación de contraseña.","Carga incremental del ETL (se usa recarga completa).","Tableros de BI externos (Power BI, Tableau).","Versiones móviles nativas."],"alcance_proyecto":"Documentación de gestión (acta, alcance, EDT, cronograma, interesados, comunicaciones, calidad, riesgos), desarrollo y pruebas del producto, exposición final e informe de cierre. El detalle está en `02_edt_cronograma_costos.md`.","supuestos":["el grupo dispone de Docker y de un equipo para ejecutar las bases","los datos de prueba son sintéticos","los demás grupos entregarán datos que el ETL pueda leer (Excel o MySQL, según el diagrama del Grupo 8)","las horas y los porcentajes de avance de este borrador se validarán con el grupo"],"restricciones":["plazo fijo del 28 de noviembre","equipo de 3 personas","el curso de Bases de Datos II enseña SQL Server","el grupo decidió que el almacén se implementa en MySQL (decisión definitiva del 24 de octubre)"],"autoridad":["aprobar cambios de alcance dentro del equipo y registrarlos","reasignar paquetes de trabajo","usar las reservas de contingencia y de gestión","convocar la reunión semanal","escalar a los docentes lo que excede la autoridad del equipo (por ejemplo, el motor de base de datos o el alcance de una entrega)"],"reporte_texto":{"Desempeño":"Hecho: ER de las fuentes (entregado), modelo estrella y ETL, aplicación con carga masiva, MFA, roles y auditoría, 49 pruebas e2e en verde, reconciliación fuente–DW con diferencia 0. Pendiente: presentar el diseño estrella (30 oct.), conectar el ETL con datos reales, documento técnico, informe de cierre y exposición.","Riesgos principales":"(1) El plazo de Bases de Datos II tiene solo 2 días de holgura y ≈ 74% de probabilidad de cumplirse (riesgo R2). (2) Fuga de datos de salud de la aplicación (R12): controles aplicados, pendientes HTTPS y cookie HttpOnly antes de publicar. (3) Omitir la declaración de uso de IA limita la nota al 60% (R8).","Acciones y decisiones":"Decisión tomada: el almacén es MySQL (definitivo; R1 cerrado); cada integrante completa su fila del laboratorio A1-b; registrar horas reales para calcular el CPI; adelantar el ETL con datos reales; usar el apéndice de IA en cada entrega."},"hibrido_texto":["Marco **predictivo** (Fase 0 y hitos fin-a-inicio en la ruta crítica) con ejecución **ágil** por sprints, cada uno con su *Sprint Goal*, su incremento y su *Definition of Done* (Scrum Guide 2020 y sesión del 24 de octubre).","La regla del roadmap de la sesión se adapta así: **el modelo de datos verificado va antes que las consultas, y cada sprint construye sobre lo que el anterior dejó verificado**.","Entre sprints hay un hito: si uno se atrasa, se mueve la fecha de los primeros pasos del siguiente (no se solapan sin verificación). El *Product Backlog* son las historias de usuario de `01_acta_y_alcance.md` (Parte B)."],"edt_nivel1":["1 Gestión del proyecto","2 Datos – Bases de Datos II","3 Aplicación web","4 Calidad y pruebas","5 Cierre"],"reglas_com":["Los datos de pacientes **no** se envían por chat ni correo; solo datos sintéticos o anonimizados.","Un problema bloqueante se avisa el mismo día, sin esperar la reunión semanal.","Todo documento enviado a los docentes lleva el apéndice de declaración de uso de IA (sanción por omisión: calificación máxima del 60%)."],"ciclo_riesgos":{"Preparar":"*Propósito:* proteger el plazo, la calidad de las entregas y los datos de salud que manejará la aplicación. *Alcance:* el módulo del Grupo 4 (aplicación, almacén de datos y documentos). *Horizonte:* hasta el 28 de noviembre de 2026 para los riesgos del proyecto y 6 meses para los de seguridad de la aplicación. *Escala:* cualitativa de tres niveles (matriz 3×3). *Fuentes:* material de las sesiones 10 y del 24 de octubre, el estándar del curso, la OPS [1] y la experiencia del grupo. *Supuesto:* las valoraciones son iniciales y las valida el grupo.","Conducir":"Cada riesgo se identifica con lluvia de ideas y con la lista de categorías de la RBS (TABLA II), y se evalúa con probabilidad, impacto y **el porqué** de cada valor («alto porque…»), para que otra persona llegue al mismo resultado (buena práctica de NIST). Los riesgos de seguridad se describen con el modelo de NIST: fuente de amenaza → evento → vulnerabilidad → impacto adverso, con su condición predisponente (TABLA IV). Se recuerda que **severidad no es riesgo**: una vulnerabilidad de puntaje 10.0 puede dejar un riesgo residual bajo si el equipo ya está corregido.","Comunicar":"Un riesgo de nivel alto o crítico se informa al docente correspondiente en la misma semana y en el reporte de estado.","Mantener":"La matriz se revisa cada semana y al cerrar cada sprint; el riesgo cambia con la fase: más incertidumbre al iniciar, menos al implementar y, al cierre, se registra lo ocurrido en las lecciones aprendidas."},"mensaje_gerente":"Mensaje de tres líneas al gerente (borrador del integrante 1; cada integrante redacta el suyo): **Riesgo:** mi equipo está fuera del rango de la vulnerabilidad crítica CVE-2025-43300, por lo que el riesgo residual es bajo. **Decisión:** mantener el equipo actualizado y revisar el inventario cada mes (control aplicado). **Costo:** sin horas adicionales a las ≈ 0.5 h mensuales de revisión. ### Oportunidades (estrategias: explotar, mejorar, compartir, aceptar, escalar) | Id | Oportunidad | Estrategia | Respuesta | |---|---|---|---| | O1 | Otros grupos podrían adoptar el contrato de datos y la plantilla CSV | Compartir | Publicar la plantilla y el esquema fuente a los grupos 1–3 | | O2 | Las pruebas e2e y la reconciliación automática acortan la verificación final | Mejorar | Ejecutarlas antes de cada entrega y registrar el resultado | ### Reservas - **Reserva de contingencia** (riesgos identificados): las respuestas de la TABLA III suman **19 h**. El 10% del BAC que sugiere la sesión 10 son 16.8 h y **no alcanza**; se fija en **13% = 21.8 h** (BAC de 168 h), que cubre las 19 h con 2.8 h de margen. - **Reserva de gestión** (imprevistos no identificados, bajo control del líder): 8.4 h = 5% del BAC. - Se reajusta la reserva de contingencia cuando cambia la priorización de riesgos (buena práctica de la sesión 10). Seguimiento: revisar la matriz cada semana; un riesgo de nivel alto o crítico se informa al docente correspondiente en la misma semana. ## 2. Plan de gestión de la calidad integrado (método de la sesión 11) La calidad se define **contra requisitos documentados** (no contra opinión) y se trata como **principio** de PMBOK 8 en los siete dominios, con las prácticas de planificar (ISO 21502 7.11.2), asegurar (7.11.3) y controlar (7.11.4) la calidad [3]. El producto se evalúa con cinco características de ISO/IEC 25010:2023 [4]: adecuación funcional, fiabilidad, seguridad, usabilidad y eficiencia de desempeño. ### 2.1 Especificaciones de calidad medibles (qué, unidad, cómo, mínimo, meta) **TABLA VII: ESPECIFICACIÓN DE CALIDAD** | Qué (atributo) | Unidad | Cómo se mide | Mínimo | Meta | Estado | |---|---|---|---|---|---| | Fiabilidad del ETL (la fuente y el DW cuadran) | Diferencia absoluta en filas y en montos | `dw/sql/07_reconciliacion.sql` después de cada carga | 0 | 0 | **Cumple (24 oct.)**: diferencia 0 | | Adecuación funcional de la aplicación | % de pruebas e2e en verde | `npm run test:e2e` | 100% | 100% | **Cumple (24 oct.)**: 49 de 49 | | Seguridad: confidencialidad de datos personales | Columnas con nombre, DPI o teléfono en el DW | Revisión del diccionario de dimensiones | 0 | 0 | **Cumple**: 0 columnas | | Seguridad: autenticación | % de cuentas que necesitan un segundo factor (MFA) para obtener sesión | Pruebas e2e de MFA (token parcial sin acceso, código de un solo uso, bloqueo) | 100% | 100% | **Cumple (24 oct.)** | | Seguridad: trazabilidad | % de cambios, inicios de sesión y exportaciones desde la interfaz que quedan en la auditoría, con su autor | Pruebas e2e de bitácora y exportación | 100% | 100% | **Cumple (24 oct.)**; límite: la exportación se registra desde el cliente | | Seguridad: aislamiento entre entidades | Intentos de acceso cruzado que se rechazan | Pruebas e2e de aislamiento (404/403) | 100% | 100% | **Cumple** | | Usabilidad (calidad percibida) | % de personas que registran un paciente sin ayuda | Sesión con 3 a 5 personas y casos de práctica | 80% | 95% | *Pendiente de medir* | | Eficiencia de desempeño | Segundos de una consulta analítica con ≈ 12,000 estudios | Tiempo de ejecución y `EXPLAIN` (consultas 1 y 8) | menos de 2 s | menos de 0.5 s | **Cumple (13 nov.)**: consulta 1 ≈ 11.1 ms y consulta 8 ≈ 1.6 ms, unas 7 veces más rápida (promedio de 50 ejecuciones, datos sintéticos) | Los mínimos y metas de usabilidad y desempeño son propuestas del grupo (ilustrativas); deben validarse antes de usarse como criterio de aceptación. ### 2.2 Integración de la calidad en los siete dominios de PMBOK 8 **TABLA VIII: CALIDAD EN LOS DOMINIOS** | Dominio | Pregunta de calidad | Aplicación en SISG | |---|---|---| | Gobernanza | ¿Se auditan los procesos y se mejora continuamente? | Auditoría en la aplicación (quién hizo qué y cuándo) y revisión semanal del grupo | | Alcance | ¿Cada requisito tiene criterio de aceptación y cómo se valida? | Criterios de aceptación por entregable (`01_acta_y_alcance.md`, B.3) | | Cronograma | ¿La prevención y las pruebas están dentro de cada entregable? | Pruebas e2e y reconciliación se ejecutan antes de cada entrega (paquetes 4.1 y 4.2) | | Finanzas | ¿Se presupuestó el costo de la calidad? | Paquetes 4.1 a 4.3 suman 17 h de 168 h de presupuesto | | Interesados | ¿La percepción del usuario se traduce en requisitos medibles? | Sesión de usabilidad y especificación de \"facilidad de uso\" (TABLA VII) | | Recursos | ¿El equipo tiene capacitación y herramientas desde el inicio? | Docker y scripts reproducibles (`run.sh`, `run_app.sh`); revisión por pares | | Riesgo | ¿Qué defectos detectados tarde tendrían mayor impacto? | Un error en el ETL falsea todos los indicadores: por eso la reconciliación es obligatoria (R3, R8); y una fuga de datos tendría el mayor impacto (R12) | ### 2.3 Actividades de aseguramiento y control 1. **Planificar (7.11.2):** especificaciones de la TABLA VII y criterios por entregable. 2. **Asegurar (7.11.3):** revisión por pares con lista de verificación (alcance, formato IEEE, apéndice de IA) y ejecución completa desde cero antes de entregar. 3. **Controlar (7.11.4):** pruebas e2e, reconciliación fuente–DW, registro de defectos y su corrección. ### 2.4 Defectos encontrados y corregidos durante el desarrollo **TABLA IX: REGISTRO DE DEFECTOS** | Defecto | Causa | Corrección | |---|---|---| | Las consultas se ejecutaban antes del ETL | Orden de scripts en `run.sh` | El ETL corre antes; las consultas van aparte | | La tabla de sumarización era casi tan grande como el hecho (10,106 filas) | Grano demasiado fino (incluía geografía) | Se quitó la geografía; quedó en ≈ 1,800 filas | | Los pacientes sin municipio perdían su departamento (80 estudios en \"Desconocido\") | El mapeo guardaba solo el municipio | Se guarda el departamento aparte; bajó a 40 (los que no traen ningún lugar) | | `docker-compose.yml` quedó vacío tras una edición | Se abrió el archivo para escribir antes de leerlo | Se restauró; se revisa que ningún archivo quede en 0 bytes | ## Referencias [1] Organización Panamericana de la Salud, *Bases para la construcción del Marco de Arquitectura de Salud Pública para Guatemala: Línea de base*, OPS/OMS Guatemala, 2024. [2] Project Management Institute, *Guía de los Fundamentos para la Dirección de Proyectos (Guía del PMBOK)*, 8.ª ed., 2025. [3] ISO, *ISO 21502:2020 – Project, programme and portfolio management – Guidance on project management*, 2020. [4] ISO/IEC, *ISO/IEC 25010:2023 – Systems and software quality models*, 2023. [5] Joint Task Force, *NIST SP 800-30 Rev. 1: Guide for Conducting Risk Assessments*, National Institute of Standards and Technology, 2012. [6] A. Watt, *Project Management*, cap. 16, BCcampus, 2.ª ed., 2014. [7] NIST, *National Vulnerability Database (NVD)*, https://nvd.nist.gov, consultado el 24 de octubre de 2026. [8] Apple, *About the security content of macOS Golden Gate 27*, 14 de septiembre de 2026 (entradas actualizadas el 19 de octubre), https://support.apple.com/en-us/149035.","estado_objetivos":{"cols":["#","Objetivo (específico, medible, con fecha)","Estado"],"rows":[["O1","ER de las fuentes en 3FN con llaves, restricciones e índices, entregado el 25 oct.","Cumplido (paquete 2.1 al 100 %)"],["O2","Modelo estrella de 2 hechos y 3 dimensiones conformadas, sin datos personales, presentado el 30 oct.","Diseño completo y documentado (DISENO_ESTRELLA.md)"],["O3","ETL con datos reales de la app y reconciliación con diferencia 0 antes del 5 nov.","Cumplido: puente app → almacén y reconciliación en 0"],["O4","Al menos 8 preguntas de análisis con consultas antes del 10 nov.","Cumplido: 8 consultas con sus vistas"],["O5","Documentos de gestión completos y validados con el grupo al 2 nov.","Redactados; la validación del grupo sigue pendiente"],["O6","Exponer el 20–21 nov. y entregar BD II antes del 28 nov., 8:00","En curso"]]},"estado_criterios":{"cols":["#","Criterio","Resultado"],"rows":[["1","La reconciliación fuente–DW da diferencia 0 en filas y montos después de cada carga","Cumple: 0 en estudios, campañas y resumen (verificado en noviembre)"],["2","Las pruebas e2e de la aplicación pasan al 100 %","Cumple: eran 49 al 24 oct.; hoy son 103"],["3","El almacén contiene 0 columnas con nombre, DPI o teléfono","Cumple: 0 columnas"],["4","Toda entrega incluye carátula, formato IEEE y el apéndice de declaración de uso de IA","Cumple: Word IEEE y apéndice listos; nivel de modificación declarado (≈ 70 % revisado a mano)"],["5","El plazo de BD II se cumple con al menos 2 días de holgura","2 días de holgura y ≈ 74 % de probabilidad (24 oct.)"],["6","Al menos 80 % de las personas registran un paciente sin ayuda","Pendiente de medir (guía de la prueba lista)"]]},"estado_backlog":{"cols":["Id","Historia","Criterio de aceptación","Prio.","Estado"],"rows":[["H1","Como centro de diagnóstico, registrar un estudio de un paciente para llevar su historial","El estudio queda ligado al paciente de mi entidad; otra entidad no lo ve","Alta","Implementada"],["H2","Como organismo no lucrativo, registrar una campaña con lugar y personas atendidas","La campaña aparece en mi lista y en el panel","Alta","Implementada"],["H3","Como centro, cargar estudios desde Excel para no digitarlos","El archivo se valida y los errores se reportan por fila","Media","Implementada con CSV"],["H4","Como analista, consultar totales por mes, tipo y departamento","Los resultados coinciden con la fuente (diferencia 0)","Alta","Resuelta con el almacén"],["H5","Como administrador, ver quién modificó un estudio","La bitácora muestra usuario, fecha y cambio","Media","Implementada (sin guardar los valores)"],["H6","Como usuario móvil, usar el sistema desde el teléfono","Menú y tablas se adaptan al ancho de pantalla","Baja","Implementada (menú y encabezado)"]]},"pendientes":{"cols":["Pendiente","Quién","Cómo se cierra"],"rows":[["Roles asignados: líder Soberanis, datos Jolón, aplicación y calidad Estrada","Grupo","Hecho (acta, sección 9)"],["Confirmar horas, % de avance, valores PERT y valoraciones de riesgo e interesados","Grupo","Reunión de validación; regenerar con plan.py"],["Registrar horas reales (AC)","Cada integrante","Calcular CPI y EAC"],["Nivel de modificación de la declaración de IA: ≈ 70 % revisado a mano","Grupo","Hecho (Apéndice A)"],["Ejecutar la prueba de usabilidad (3 a 5 personas)","Grupo","Llenar la fila de la especificación de calidad"],["Laboratorio A1-b: filas y Parte B de los integrantes 2 y 3; confirmar el CVE en el NVD","Cada integrante","Tabla de inventario completa"],["Verificar el catálogo de municipios (339 contra 340 oficial)","Datos","Corregir geografia.ts y 01b_catalogos.sql"],["Antes de publicar la app: HTTPS, cookie HttpOnly, migraciones, contraseña propia de MySQL, respaldos","Calidad","Cierra el riesgo R12"],["Leer lineamientos de los entregables 2 y 3; abrir el Word en Microsoft Word","Líder","Riesgo R11; revisión de formato"]]},"normas":{"cols":["Norma","Qué es","Dónde la aplicamos"],"rows":[["PMBOK 8 (PMI, 2025)","Guía de dirección de proyectos: siete dominios y principios","Marco del plan de gestión: la calidad como principio en los siete dominios y el ciclo del riesgo"],["ISO 21502:2020","Guía de gestión de proyectos","Riesgos (7.8: preparar, conducir, comunicar, mantener) y calidad (7.11.2 planificar, 7.11.3 asegurar, 7.11.4 controlar)"],["ISO/IEC 25010:2023","Modelo de calidad del software","Cinco características con metas medibles: adecuación funcional, fiabilidad, seguridad, usabilidad y eficiencia de desempeño (reconciliación en cero, consulta 8 unas 7 veces más rápida, MFA obligatorio)"],["NIST SP 800-30 Rev. 1","Evaluación de riesgos de seguridad","Riesgos de seguridad: fuente de amenaza, evento, vulnerabilidad e impacto, con el «porque» de cada valor"],["CVSS / CVE (NVD)","Severidad de vulnerabilidades conocidas","Laboratorio A1-b: CVE vigente del equipo de cada integrante; severidad no es riesgo"],["Scrum Guide 2020","Marco ágil","Sprints de la aplicación con Sprint Goal, incremento y Definition of Done"],["IEEE","Formato de documentos técnicos","Plan de gestión con carátula, tablas y figuras en IEEE, y Apéndice A de uso de IA"],["HL7 FHIR","Estándar de interoperabilidad en salud","La aplicación exporta datos en FHIR (extra técnico, fuera del plan de gestión)"],["ISO/IEC 27001","Gestión de seguridad de la información","No la aplicamos formalmente (sin certificación). Controles propios: MFA, roles por entidad y bitácora de auditoría"]]},"preguntas_metodologia":{"cols":["Pregunta","Respuesta"],"rows":[["¿Qué metodología usaron?","Híbrida: predictiva para los entregables fijos (hitos y ruta crítica) y ágil, con Scrum, para construir la aplicación por sprints."],["¿Por qué híbrida y no solo ágil?","Plazo y entregables los fija el curso (28 de noviembre); la aplicación sí evoluciona con un backlog priorizado."],["¿Qué ISO usaron?","ISO 21502 para gestión de proyectos, ISO/IEC 25010 para calidad del producto; PMBOK 8 como marco y NIST SP 800-30 para riesgos de seguridad."],["¿Por qué ISO/IEC 25010?","Define características de calidad que se pueden medir. Elegimos cinco y les pusimos meta y evidencia."],["¿Severidad y riesgo no son lo mismo?","No. CVSS mide qué tan grave es una vulnerabilidad; el riesgo depende además de la probabilidad y de lo que está expuesto. Un CVE grave en un equipo ya parchado deja un riesgo residual bajo."],["¿Cómo gestionan los cambios?","Los cambios al alcance de los entregables fijos pasan por el líder; los de la aplicación entran al backlog."],["¿Tienen certificación de seguridad?","No. Aplicamos controles propios (MFA, roles, bitácora); ISO/IEC 27001 queda como mejora futura."],["¿Por qué IEEE y declaración de IA?","El curso exige el formato IEEE y declarar el uso de IA en el Apéndice A; sin declaración, la nota máxima baja a 60%."]]},"preguntas_mas":{"cols":["Pregunta","Respuesta"],"rows":[["¿Por qué un enfoque híbrido?","Los entregables de BD II tienen contenido y fecha fijos (predictivo); la app evoluciona con un backlog (ágil)."],["¿Qué significa «holgura» y por qué importa?","Días que una actividad puede atrasarse sin atrasar el proyecto. La cadena de BD II tiene 2: un atraso mayor incumple la entrega."],["¿Por qué horas y no dinero?","No hay gasto monetario (Q 0); las horas-persona son el costo real. El método es el mismo con quetzales."],["¿Por qué reserva de 13 % y no 10 %?","Las respuestas a riesgos suman 19 h; el 10 % (16.8 h) no alcanza; 13 % = 21.8 h cubre con 2.8 h de margen."],["¿Qué significa SPI = 1.27?","Valor ganado ÷ planificado: vamos adelantados. Depende de % de avance estimados; no es resultado final."],["¿Por qué el CPI y el EAC son supuestos?","No se registraron las horas reales (AC); se asume AC = EV, lo que da CPI 1.00 y EAC 168 h. Es un supuesto, no una medición; se recalcula con las horas reales."],["¿Contingencia: plan o reserva?","Son distintos: el plan es el método alternativo si el riesgo ocurre; la reserva son horas para cubrirlo."],["¿Severidad y riesgo son lo mismo?","No: una vulnerabilidad de 10.0 puede dejar riesgo bajo si el equipo ya está corregido."],["¿Hubo cambios de alcance?","Sí: el 24 oct. se agregó seguridad y usuarios (paquete 3.4, +12 h); se registró con control de cambios (R6)."],["¿Cómo declaran el uso de IA?","Apéndice A con herramienta, prompt, propósito, secciones y nivel de modificación (este último, por completar por el grupo)."],["¿Qué pasa si se atrasa el ETL (C)?","Tiene 2 días de holgura. Si se pierde, se activa el plan de contingencia: entregar alcance mínimo."]]},"referencias":["Organización Panamericana de la Salud, Bases para la construcción del Marco de Arquitectura de Salud Pública para Guatemala: Línea de base, OPS/OMS Guatemala, 2024.","Project Management Institute, Guía de los Fundamentos para la Dirección de Proyectos (Guía del PMBOK), 8.ª ed., 2025.","ISO, ISO 21502:2020 – Project, programme and portfolio management – Guidance on project management, 2020.","ISO/IEC, ISO/IEC 25010:2023 – Systems and software quality models, 2023.","Joint Task Force, NIST SP 800-30 Rev. 1: Guide for Conducting Risk Assessments, NIST, 2012.","A. Watt, Project Management, cap. 16, BCcampus, 2.ª ed., 2014.","NIST, National Vulnerability Database (NVD), https://nvd.nist.gov, consultado el 24 de octubre de 2026.","Apple, About the security content of macOS Golden Gate 27, 14 de septiembre de 2026 (entradas actualizadas el 19 de octubre), https://support.apple.com/en-us/149035."],"avance_posterior":"Avance posterior: los sprints 3 y 4 ya se cumplieron en lo técnico (reconciliación en 0, 8 consultas, 103 pruebas en verde).","backlog_nota":"H3 acepta CSV, no .xlsx (Excel permite «Guardar como CSV»). H5 no guarda los valores modificados porque son datos de salud.","contexto_html":"Contexto y justificación\nEl proyecto: SISG – Módulo del Grupo 4. Registra pacientes, estudios diagnósticos y campañas de salud de dos tipos de actores, y deja los datos listos para analizarse en un almacén con modelo estrella.\nUn solo proyecto, dos cursos: Administración de Proyectos Tecnológicos (este plan) y Bases de Datos II (ER, estrella, ETL, consultas; Inga. Claudia Alegre).\nCaso de negocioLos centros y organismos alimentan y consumen datos, pero trabajan con Excel y bases aisladas.\nSin un modelo común, ministerios, aseguradoras y universidades no pueden comparar estudios ni campañas.\nLa OPS propone partir de una línea base, una arquitectura objetivo y transiciones, con interoperabilidad y seguridad como principios.\nPropósito: entregar ese modelo común y demostrar, con datos de prueba, que los indicadores se calculan sin perder filas ni montos (reconciliación en cero).","hitos_nota":"Dato clave: el examen final de Administración de Proyectos coincide con la última semana de la entrega de Bases de Datos II. Por eso el riesgo R2 es el único crítico.","notas":{"Normas y estándares: dónde se aplica cada una en SISG":"Estas son las normas y estándares que usamos y dónde se ve cada una en el proyecto. PMBOK 8 es el marco general. ISO 21502 nos da el detalle de riesgos y calidad en la gestión. ISO/IEC 25010 define las características de calidad del producto: evaluamos cinco, con metas medibles. NIST SP 800-30 estructura los riesgos de seguridad. CVSS mide la severidad de una vulnerabilidad, y distinguimos severidad de riesgo. Scrum organiza los sprints de la aplicación e IEEE define el formato de los documentos. HL7 FHIR es un extra técnico: la aplicación exporta en ese formato. Y una aclaración honesta: no aplicamos ISO 27001 de manera formal ni tenemos certificación; los controles de seguridad son propios.","Preguntas sobre metodología y normas":"Esta diapositiva reúne las preguntas más probables sobre metodología y normas, con la respuesta corta. Si preguntan por la metodología: híbrida, con una parte predictiva y otra ágil con Scrum. Si preguntan por las ISO: 21502 para la gestión y 25010 para la calidad del producto, con PMBOK 8 como marco. Y si preguntan por seguridad, aclaramos que no tenemos certificación, sino controles propios.","Pendientes y cómo se cierran":"Cerramos con transparencia: esto es lo que falta y cómo se cierra. Falta asignar personas a los roles, que el grupo confirme las estimaciones, registrar las horas reales para calcular el costo, ejecutar la prueba de usabilidad, que cada integrante complete su parte del laboratorio, verificar el catálogo de municipios, que tiene uno menos que el oficial, y los controles que se necesitan antes de publicar la aplicación de verdad. También revisar el documento en Word. Cada pendiente tiene responsable y una forma concreta de cerrarse.","Lecciones aprendidas":"Lo que funcionó: calcular cronograma, ruta crítica, PERT y valor ganado con un script, así los números de los documentos no se transcriben a mano; reconciliar la fuente contra el almacén; separar lo predictivo de lo ágil; usar las pruebas automáticas como criterio de terminado, y declarar límites y supuestos. Lo que haríamos distinto: decidir el motor de base de datos al inicio, registrar las horas reales desde el primer día porque sin ellas no hay índice de costo, usar una base propia para las pruebas desde el comienzo, congelar el alcance, porque MFA, roles y auditoría se agregaron a última hora y sumaron doce horas, y asignar personas a los roles y completar la declaración de IA a medida que se trabaja."}};

<script>
/* Base de la presentación: utilidades, registro de diapositivas y el motor (escala 1280×720, pasos internos, índice).
   → avanza (primero los pasos internos de la diapositiva) · ← retrocede · F pantalla completa · I índice · Home / End. */
(function () {
  "use strict";
  const A = window.APT;
  const K = (window.K = { A, slides: [] });
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  K.REDUCED = REDUCED;

  /* ---------- utilidades ---------- */
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  K.esc = esc;
  K.fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(«])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  K.$ = (s, r) => (r || document).querySelector(s);
  K.$$ = (s, r) => [...(r || document).querySelectorAll(s)];
  K.N = (n) => Number(n).toLocaleString("en-US");
  K.num = (s) => { const m = String(s).replace(",", ".").match(/-?\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };
  K.plain = (s) => String(s).replace(/\*\*|`|\*/g, "");
  K.clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  K.store = {
    get(k, d) { try { const v = localStorage.getItem("sisgapt:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("sisgapt:" + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
  };
  K.countUp = (el, to, ms, f) => {
    f = f || K.N; const dec = String(to).includes(".") ? 1 : 0;
    if (REDUCED) { el.textContent = f(to); return; }
    const t0 = performance.now();
    (function tick(t) { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3), v = to * e; el.textContent = f(dec ? +v.toFixed(1) : Math.round(v)); if (k < 1 && el.isConnected) requestAnimationFrame(tick); })(t0);
  };

  /* estado a partir del texto de los documentos: verde = cumplido, ámbar = en curso, rojo = pendiente */
  K.status = (txt) => {
    const t = String(txt).toLowerCase();
    if (/^(cumplido|cumple|hecho|implementad|resuelta|listo)/.test(t)) return "ok";
    if (/pendiente|por iniciar|por completar|por validar|sin dato/.test(t)) return "pend";
    return "run";
  };
  K.badge = (txt, cls) => `<span class="badge ${cls || ""}">${K.fmt(txt)}</span>`;
  K.level = (txt) => { const t = K.plain(txt).toLowerCase(); return /cr[ií]tico/.test(t) ? "crit" : /alto/.test(t) ? "alto" : /medio/.test(t) ? "medio" : "bajo"; };

  /* tabla HTML a partir de {cols, rows}. opt.cols: índices a mostrar · opt.fmt(v, ci, row): celda · opt.rowCls(row, i) */
  K.tbl = (t, opt) => {
    opt = opt || {}; const idx = opt.cols || t.cols.map((_, i) => i);
    const f = opt.fmt || ((v) => K.fmt(v));
    return `<table class="dt ${opt.cls || ""}"><thead><tr>${idx.map((i) => `<th>${esc(opt.heads && opt.heads[i] != null ? opt.heads[i] : t.cols[i])}</th>`).join("")}</tr></thead><tbody>` +
      t.rows.map((r, ri) => `<tr data-i="${ri}" class="${opt.rowCls ? opt.rowCls(r, ri) : ""}">${idx.map((i) => `<td${opt.num !== false && /^\s*[-\d.,%]+\s*$/.test(r[i]) ? ' class="n"' : ""}>${f(r[i], i, r)}</td>`).join("")}</tr>`).join("") + `</tbody></table>`;
  };

  /* ---------- registro de diapositivas ---------- */
  K.SEC = {
    cover: ["", ""], ini: ["Iniciación", "orange"], met: ["Metodología", "blue"], pla: ["Planificación", "purple"],
    int: ["Interesados", "green"], rie: ["Riesgos", "pink"], cal: ["Calidad", "teal"], cie: ["Cierre", "yellow"],
  };
  K.add = (sec, title, text, render, o) => K.slides.push(Object.assign({ sec, title, text, render }, o || {}));

  /* =====================================================================
     MOTOR
     ===================================================================== */
  const D = (K.deck = {});
  let idx = -1, ctxNow = null, build = { max: 0, i: 0, fn: null }, keys = {}, ready = false;
  const root = () => K.$("#deck");

  function makeCtx(back) {
    const items = [];
    return {
      back,
      timer(fn, ms) { const t = setInterval(fn, ms); items.push(() => clearInterval(t)); return t; },
      timeout(fn, ms) { const t = setTimeout(fn, ms); items.push(() => clearTimeout(t)); return t; },
      on(el, ev, fn) { el.addEventListener(ev, fn); items.push(() => el.removeEventListener(ev, fn)); },
      onKey(k, fn) { keys[k] = fn; },
      cleanup(fn) { items.push(fn); },
      builds(n, fn) { build = { max: n, i: back ? n - 1 : 0, fn }; dots(); fn(build.i); },
      dispose() { items.forEach((f) => f()); items.length = 0; keys = {}; build = { max: 0, i: 0, fn: null }; },
    };
  }
  function dots() { const d = K.$(".sl-dots", root()); if (d) d.innerHTML = build.max > 1 ? Array.from({ length: build.max }, (_, k) => `<i class="${k <= build.i ? "on" : ""}"></i>`).join("") : ""; }
  function fit() {
    const v = K.$(".dk-view", root()), s = K.$("#dk-slide"); if (!v || !s) return;
    s.style.transform = `translate(-50%, -50%) scale(${Math.min(v.clientWidth / 1280, v.clientHeight / 720)})`;
  }
  function mount(i, back) {
    if (ctxNow) ctxNow.dispose();
    const S = K.slides[i], host = K.$("#dk-slide"), k = K.SEC[S.sec] || K.SEC.ini;
    host.className = "dk-slide" + (S.cover ? " is-cover" : "");
    host.innerHTML = (S.cover ? "" : `<div class="sl-head"><span class="kick" style="--c:var(--c-${k[1]})">${String(i + 1).padStart(2, "0")} · ${k[0]}</span><h1>${esc(S.title)}</h1></div>`) + `<div class="sl-body"></div><div class="sl-dots"></div>`;
    ctxNow = makeCtx(back);
    S.render(K.$(".sl-body", host), ctxNow);
    dots();
  }
  D.show = (n) => {
    init(); const el = root(); el.hidden = false;
    n = K.clamp(n, 1, K.slides.length) - 1; fit();
    if (n !== idx) { const prev = idx; idx = n; mount(n, prev - n === 1); }
    K.$(".dk-count", el).textContent = `${String(n + 1).padStart(2, "0")} / ${K.slides.length}`;
    K.$(".dk-name", el).textContent = K.slides[n].title;
    K.$(".dk-bar i", el).style.width = ((n + 1) / K.slides.length) * 100 + "%";
    K.$$("#dk-index button", el).forEach((b, k) => b.setAttribute("aria-current", k === n ? "true" : "false"));
    const h = `#/p/${n + 1}`; if (location.hash !== h) history.replaceState(null, "", h);
    document.title = `${K.slides[n].title} · SISG · Administración de Proyectos`;
  };
  K.go = (n) => { location.hash = `#/p/${K.clamp(n, 1, K.slides.length)}`; };
  function next() { if (build.max > 1 && build.i < build.max - 1) { build.i++; build.fn(build.i); dots(); } else if (idx < K.slides.length - 1) K.go(idx + 2); }
  function prev() { if (build.max > 1 && build.i > 0) { build.i--; build.fn(build.i); dots(); } else if (idx > 0) K.go(idx); }
  function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); }

  function init() {
    if (ready) return; ready = true;
    const el = root();
    el.innerHTML = `<div class="dk-top"><span class="dk-count"></span><span class="dk-name"></span><span class="grow"></span>
      <button type="button" id="dk-prev" title="Anterior (←)" aria-label="Anterior">←</button><button type="button" id="dk-next" title="Siguiente (→)" aria-label="Siguiente">→</button>
      <button type="button" id="dk-idx" title="Índice (I)">Índice</button><button type="button" id="dk-full" title="Pantalla completa (F)">Pantalla completa</button></div>
      <div class="dk-view"><div class="dk-slide" id="dk-slide"></div></div><div class="dk-bar"><i></i></div>
      <aside id="dk-index" hidden><h3>Diapositivas</h3><input type="search" id="dk-q" placeholder="Buscar en todo el contenido (/)" autocomplete="off" aria-label="Buscar diapositiva"><div id="dk-nres"></div>${K.slides.map((s, i) => `<button type="button" data-i="${i}"><i>${String(i + 1).padStart(2, "0")}</i><span>${esc(s.title)}<small class="sn"></small></span></button>`).join("")}</aside>`;
    K.$("#dk-prev", el).onclick = prev; K.$("#dk-next", el).onclick = next;
    K.$("#dk-idx", el).onclick = () => { const x = K.$("#dk-index", el); x.hidden = !x.hidden; if (!x.hidden) { const c = K.$('[aria-current="true"]', x); if (c) c.scrollIntoView({ block: "center" }); } };
    const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""), q = K.$("#dk-q", el), idxB = K.$$("#dk-index button", el);
    /* Texto completo: se dibuja cada diapositiva fuera de pantalla (con todos sus pasos y botones de detalle) y se guarda su texto; se hace una sola vez, al primer uso. */
    let hay = null;
    const cosecha = (S) => {
      const body = document.createElement("div"), txt = [S.title, S.text || ""], ta = document.createElement("textarea"), grab = () => { ta.innerHTML = body.innerHTML.replace(/<[^>]+>/g, " "); txt.push(ta.value); };
      const c = { back: false, timer() {}, timeout() {}, cleanup() {}, onKey() {}, dispose() {}, on(e, ev, f) { e.addEventListener(ev, f); }, builds(n, f) { for (let k = 0; k < n; k++) { f(k); grab(); } } };
      try { S.render(body, c); grab(); body.querySelectorAll("button:not([data-go]):not(.btn)").forEach((b) => { b.click(); grab(); }); } catch (e) { /* una diapositiva que falle conserva el texto ya obtenido */ }
      return txt.join(" \n ").replace(/\s+/g, " ");
    };
    const filtra = () => {
      if (!hay) hay = K.slides.map((s) => { const raw = cosecha(s); return { raw, n: norm(raw) }; });
      const t = norm(q.value).split(/\s+/).filter(Boolean); let c = 0;
      idxB.forEach((b, i) => {
        const h = hay[i], ok = t.every((w) => h.n.includes(w)), sn = K.$(".sn", b); b.hidden = !ok; if (ok) c++;
        if (!ok || !t.length) { sn.textContent = ""; return; }
        const p = Math.max(0, h.n.indexOf(t[0]) - 28); /* shortcut: sin conteo de coincidencias; una diapositiva con pasos repite su texto al cosecharlo */
        sn.textContent = "…" + h.raw.slice(p, p + 90) + "…";
      });
      K.$("#dk-nres", el).textContent = t.length ? c + " de " + K.slides.length + " diapositivas" : "";
    };
    q.oninput = filtra;
    q.onkeydown = (e) => { if (e.key === "Enter") { const b = idxB.find((x) => !x.hidden); if (b) b.click(); } else if (e.key === "Escape") { q.value = ""; filtra(); K.$("#dk-index", el).hidden = true; q.blur(); } };
    K.$$("#dk-index button", el).forEach((b) => (b.onclick = () => { K.$("#dk-index", el).hidden = true; K.go(+b.dataset.i + 1); }));
    K.$("#dk-full", el).onclick = toggleFull;
    addEventListener("resize", fit); new ResizeObserver(fit).observe(K.$(".dk-view", el));
    document.addEventListener("fullscreenchange", () => { document.body.classList.toggle("dk-full", !!document.fullscreenElement); setTimeout(fit, 60); });
    addEventListener("keydown", (e) => {
      if (root().hidden || e.metaKey || e.ctrlKey || e.altKey) return;
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (keys[e.key]) { keys[e.key](e); return; }
      if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && e.target.tagName !== "BUTTON")) { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
      else if (e.key === "Home") K.go(1); else if (e.key === "End") K.go(K.slides.length);
      else if (e.key === "f" || e.key === "F") toggleFull();
      else if (e.key === "i" || e.key === "I") K.$("#dk-idx").click();
      else if (e.key === "/") { e.preventDefault(); const x = K.$("#dk-index"); x.hidden = false; K.$("#dk-q").focus(); K.$("#dk-q").select(); }
      else if (e.key === "Escape" && !K.$("#dk-index").hidden) K.$("#dk-index").hidden = true;
    });
  }
  K.start = () => {
    const go = () => { const m = /^#\/p\/(\d+)$/.exec(location.hash); D.show(m ? +m[1] : 1); };
    addEventListener("hashchange", go);
    (document.fonts && document.fonts.load ? Promise.race([document.fonts.load('600 14px "JetBrains Mono"'), new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve()).catch(() => {}).then(go);
  };
})();

<script>
/* Diapositivas 1 a 13: portada, agenda, iniciación (acta y alcance) y metodología (híbrido, Scrum, etapas, backlog). */
(function () {
  "use strict";
  const K = window.K, A = K.A, esc = K.esc, fmt = K.fmt, $ = K.$, $$ = K.$$;
  const COL = { ok: "Cumple", run: "En curso", pend: "Pendiente" };
  const st = (txt) => { const s = K.status(txt); return `<span class="badge ${s}">${COL[s]}</span>`; };

  /* ============ 1 · portada ============ */
  K.add("cover", "SISG · Administración de Proyectos", "portada curso docente Grupo 4 plan de gestión", (b, ctx) => {

      <div class="call ok"><b>Mensaje final</b>Un enfoque híbrido —Fase 0 predictiva y sprints ágiles— apoyado en PMBOK 8, ISO 21502, ISO/IEC 25010 y NIST 800-30, con números que se pueden recalcular y riesgos con dueño y reserva.</div><p class="foot">Grupo 4 · ${esc(A.curso)} · ${esc(A.docentes[0])}</p></div>`;
    const a = $$(".fin-k > div", b); ctx.builds(2, (i) => a.forEach((e) => e.classList.toggle("on", i === 1)));
    ctx.timeout(80, 80);
  });
})();

</script>
<script>
(function () {
  const set = (t) => { document.documentElement.dataset.theme = t; try { localStorage.setItem("sisgapt:theme", JSON.stringify(t)); } catch (e) {} };
  let t = null; try { t = JSON.parse(localStorage.getItem("sisgapt:theme")); } catch (e) {}
  set(t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  document.getElementById("b-theme").addEventListener("click", () => set(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
  window.K.start();
})();
</script>
